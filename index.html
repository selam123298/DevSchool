<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSchool - Kod & Mesajlaşma Platformu</title>
  
  <!-- FontAwesome & Prism CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  
  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --accent-hover: #1f6feb;
      --border-color: #30363d;
      --code-bg: #0d1117;
      --card-bg: #161b22;
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f8fa;
      --bg-tertiary: #eaeea1;
      --text-main: #24292f;
      --text-muted: #57606a;
      --accent-color: #0969da;
      --accent-hover: #0c2d6b;
      --border-color: #d0d7de;
      --code-bg: #24292e;
      --card-bg: #ffffff;
    }

    [data-theme="cyberpunk"] {
      --bg-primary: #050505;
      --bg-secondary: #120024;
      --bg-tertiary: #2a004f;
      --text-main: #00ffcc;
      --text-muted: #ff007f;
      --accent-color: #ff007f;
      --accent-hover: #b30059;
      --border-color: #00ffcc;
      --code-bg: #050505;
      --card-bg: #120024;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: all 0.3s ease; }

    /* Auth Screen */
    .auth-overlay { position: fixed; inset: 0; background: var(--bg-primary); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); text-align: center; }
    .auth-card h2 { margin-bottom: 1.5rem; color: var(--accent-color); font-size: 1.8rem; }
    .input-group { margin-bottom: 1rem; text-align: left; }
    .input-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-muted); }
    .input-group input { width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; outline: none; }
    .btn { width: 100%; padding: 0.75rem; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
    .btn:hover { background: var(--accent-hover); }

    /* Main App Layout */
    .sidebar { width: 300px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-color); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
    .chat-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .chat-item { padding: 0.75rem; border-radius: 6px; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; transition: background 0.2s; margin-bottom: 0.2rem; }
    .chat-item:hover, .chat-item.active { background: var(--bg-tertiary); }

    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
    .chat-header { padding: 1rem; border-bottom: 1px solid var(--border-color); background: var(--bg-secondary); display: flex; align-items: center; justify-content: space-between; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    
    .message { display: flex; flex-direction: column; max-width: 70%; }
    .message.sent { align-self: flex-end; }
    .message.received { align-self: flex-start; }
    .message-header { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.2rem; display: flex; gap: 0.5rem; }
    .message-bubble { padding: 0.75rem 1rem; border-radius: 8px; background: var(--bg-tertiary); border: 1px solid var(--border-color); word-break: break-word; }
    .message.sent .message-bubble { background: var(--accent-color); color: #fff; border: none; }
    
    .chat-input-area { padding: 1rem; background: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; gap: 0.5rem; align-items: center; }
    .chat-input-area input { flex: 1; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; outline: none; }

    pre { margin-top: 0.5rem!important; border-radius: 6px!important; }
    .hidden { display: none!important; }
    .theme-select { background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Auth Overlay -->
  <div id="authScreen" class="auth-overlay">
    <div class="auth-card">
      <h2><i class="fa-solid fa-code"></i> DevSchool</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Giriş Yap veya Hesap Oluştur</p>
      <div class="input-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="usernameInput" placeholder="Örn: Yigit">
      </div>
      <button class="btn" onclick="login()">Sisteme Giriş Yap</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="user-profile">
        <div class="avatar" id="myAvatar">?</div>
        <div>
          <div style="font-weight: 600;" id="myUsername">Kullanıcı</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Çevrimiçi</div>
        </div>
      </div>
      <select class="theme-select" onchange="changeTheme(this.value)">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="cyberpunk">Cyberpunk</option>
      </select>
    </div>
    <div class="chat-list">
      <div class="chat-item active">
        <i class="fa-solid fa-hashtag" style="color: var(--accent-color);"></i>
        <div>
          <div style="font-weight: 600;"># Genel Sohbet</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Okul Odası</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="main-chat">
    <div class="chat-header">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <i class="fa-solid fa-hashtag"></i>
        <span style="font-weight: 600;">Genel Sohbet & Kod Paylaşımı</span>
      </div>
    </div>

    <div class="messages-container" id="messagesContainer">
      <!-- Mesajlar buraya veritabanından yüklenecek -->
    </div>

    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Mesaj yazın veya kod yapıştırın..." onkeypress="handleKeyPress(event)">
      <button class="btn" style="width: auto; padding: 0.75rem 1.5rem;" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- Prism JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCGSljEvthgH6QYasetqpS9xsuNfV_RIzI",
      authDomain: "devschool-558db.firebaseapp.com",
      projectId: "devschool-558db",
      storageBucket: "devschool-558db.firebasestorage.app",
      messagingSenderId: "99712932913",
      appId: "1:99712932913:web:b146802b32dd0e26b1c910"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = "";

    function login() {
      const username = document.getElementById("usernameInput").value.trim();
      if (!username) return alert("Lütfen bir kullanıcı adı girin!");
      
      currentUser = username;
      document.getElementById("myUsername").innerText = currentUser;
      document.getElementById("myAvatar").innerText = currentUser[0].toUpperCase();
      document.getElementById("authScreen").classList.add("hidden");

      listenForMessages();
    }

    function changeTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;

      const isCode = text.includes("function") || text.includes("var") || text.includes("let") || text.includes("const") || text.includes("<") || text.includes("class");

      db.collection("messages").add({
        user: currentUser,
        text: text,
        isCode: isCode,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      input.value = "";
    }

    function listenForMessages() {
      db.collection("messages").orderBy("timestamp", "asc")
        .onSnapshot(snapshot => {
          const container = document.getElementById("messagesContainer");
          container.innerHTML = "";

          snapshot.forEach(doc => {
            const data = doc.data();
            if (!data.text) return;

            const isMe = data.user === currentUser;
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${isMe ? 'sent' : 'received'}`;

            let contentHTML = "";
            if (data.isCode) {
              contentHTML = `<pre><code class="language-javascript">${escapeHTML(data.text)}</code></pre>`;
            } else {
              contentHTML = `<div class="message-bubble">${escapeHTML(data.text)}</div>`;
            }

            messageDiv.innerHTML = `
              <div class="message-header">
                <span>${data.user}</span>
              </div>
              ${contentHTML}
            `;

            container.appendChild(messageDiv);
          });

          Prism.highlightAll();
          container.scrollTop = container.scrollHeight;
        });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
